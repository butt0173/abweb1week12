<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Embedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sour+Gummy:ital,wdth,wght@0,100..125,100..900;1,100..125,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css"> 
    <meta name="referrer" content="origin">
</head>
<body>
    <div class="container">
        <header>
            <h1>This is a fancy title</h1>
        </header>

        <!-- AI Prompt: in the main, add a section with an h3 and two paragraphs about snow. -->
        <main>
            <section>
                <h3>Snow</h3>
                <p>Snow forms when tiny ice crystals in clouds stick together and fall to the ground in cold conditions.</p>
                <p>Fresh snow brightens the landscape and creates a quiet, peaceful atmosphere.</p>
            </section>

            <section>
                <!-- embedding external resources like
                 videos and maps -->
                <iframe width="560" height="315" src="https://www.youtube.com/embed/qk6MeIXsUeU?rel=0" title="Getting Started with Flexbox" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="origin" allowfullscreen></iframe>

                <iframe class="maps" src="https://www.google.com/maps/embed?pb=!1m16!1m12!1m3!1d5608.17325049204!2d-75.75791114498533!3d45.34706359728687!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!2m1!1sAlgonquin%20College!5e0!3m2!1sen!2sca!4v1795541887084!5m2!1sen!2sca" width="600" height="450" title="Map of Algonquin College" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </section>
        </main>
    </div>
</body>
</html>
